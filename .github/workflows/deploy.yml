name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mju-graduate-server
      SHARED_MASTER_CACHE_ENABLED: ${{ vars.SHARED_MASTER_CACHE_ENABLED || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Autoheal deployment script
        run: python3 -m unittest discover -s infra/deployment -p 'test_*.py'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle 캐시
      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle 8.10 기준 빌드 (테스트 제외)
      - name: Build without tests
        run: ./gradlew clean build -x test --no-daemon

      # Docker 빌드 (시크릿은 빌드 인자에서 제거)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:v2
            ${{ env.DOCKER_IMAGE }}:${{ env.DEPLOYMENT_ID }}

      - name: Prepare production host memory
        uses: appleboy/ssh-action@master
        timeout-minutes: 3
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.WAS_KEY }}
          command_timeout: 2m
          script_path: infra/deployment/prepare-host-memory.sh

      # 원격 배포 (런타임에 -e로 시크릿 주입)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        timeout-minutes: 22
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.WAS_KEY }}
          command_timeout: 20m
          envs: DEPLOYMENT_ID,DOCKER_IMAGE,SHARED_MASTER_CACHE_ENABLED
          script: |
            set -euo pipefail

            case "$SHARED_MASTER_CACHE_ENABLED" in
              true|false) ;;
              *) echo "SHARED_MASTER_CACHE_ENABLED must be true or false"; exit 1 ;;
            esac

            echo "[Disk before]"
            docker system df || true
            df -h || true

            # Ensure network exists (avoid noisy error)
            if ! docker network inspect mju-net >/dev/null 2>&1; then
              docker network create mju-net
            fi

            echo "[Light cleanup] dangling images and builder cache only; preserve data volumes"
            docker images -f "dangling=true" -q | xargs -r docker rmi || true
            docker builder prune -af || true

            echo "Ensure Redis is running without replacing it"
            if docker container inspect mg-redis >/dev/null 2>&1; then
              if [ "$(docker inspect --format '{{.State.Running}}' mg-redis)" != "true" ]; then
                docker start mg-redis
              fi
            else
              docker volume create mg-redis-data >/dev/null
              docker run -d --name mg-redis \
                --network mju-net \
                --restart unless-stopped \
                --log-opt max-size=10m --log-opt max-file=3 \
                -p 6379:6379 \
                -v mg-redis-data:/data \
                redis:7-alpine
            fi

            echo "Waiting for Redis to be ready..."
            REDIS_READY=false
            for i in $(seq 1 30); do
              if docker exec mg-redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
                echo "Redis is ready."
                REDIS_READY=true
                break
              fi
              echo "  still waiting ($i/30)..."
              sleep 1
            done
            if [ "$REDIS_READY" != "true" ]; then
              echo "Redis is not ready; keeping the current application container."
              exit 1
            fi

            docker pull "$DOCKER_IMAGE:$DEPLOYMENT_ID"
            echo "App restart"
            docker rm -f mju-graduate-server || true

            docker run -d --name mju-graduate-server \
              --memory=640m --memory-reservation=512m --memory-swap=1g \
              --label autoheal=true \
              --health-start-period=300s --health-timeout=10s --health-retries=5 \
              -e JAVA_OPTS="-Xms64m -Xmx256m -XX:ActiveProcessorCount=2" \
              --network mju-net \
              --restart unless-stopped \
              --log-opt max-size=10m --log-opt max-file=3 \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SHARED_MASTER_CACHE_ENABLED="$SHARED_MASTER_CACHE_ENABLED" \
              -e SHARED_MASTER_CACHE_NAMESPACE=prod \
              -e SHARED_MASTER_CACHE_VERSION="$DEPLOYMENT_ID" \
              -e SPRING_DATASOURCE_URL='${{ secrets.DATASOURCE_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.DATASOURCE_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DATASOURCE_PASSWORD }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              -e SPRING_DATA_REDIS_HOST=mg-redis \
              -e SPRING_DATA_REDIS_PORT=6379 \
              -e ADMIN_API_KEY='${{ secrets.ADMIN_API_KEY }}' \
              "$DOCKER_IMAGE:$DEPLOYMENT_ID"

            APP_READY=false
            for i in $(seq 1 90); do
              if [ "$(docker inspect --format '{{.State.Health.Status}}' mju-graduate-server)" = "healthy" ]; then
                APP_READY=true
                break
              fi
              sleep 5
            done
            if [ "$APP_READY" != "true" ]; then
              echo "Application did not become healthy; check startup and migration logs."
              exit 1
            fi
            echo "Deployment ready: $DEPLOYMENT_ID"

            echo "[Disk after]"
            docker system df || true
            df -h || true

      # Autoheal gets its own time budget and failure status after app readiness.
      - name: Ensure Autoheal via SSH
        uses: appleboy/ssh-action@master
        timeout-minutes: 14
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.WAS_KEY }}
          command_timeout: 12m
          script_path: infra/deployment/ensure-autoheal.sh
